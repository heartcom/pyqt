<!-- templates/index.html -->
<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title> RGB LED PWM Control</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1> RGB LED PWM Control</h1>
        <p class="desc">R / G / B 각 채널에 대해 0 ~ 100 (% 밝기)를 입력한 후 전송 버튼을 누르세요.</p>

        <form method="post" action="{{ url_for('set_rgb') }}" class="rgb-form">
            <div class="row red-row">
                <label for="r">RED (0~100)</label>
                <input type="number"
                       id="r" name="r"
                       min="0" max="100" step="1"
                       value="{{ r_value }}">
            </div>

            <div class="row green-row">
                <label for="g">GREEN (0~100)</label>
                <input type="number"
                       id="g" name="g"
                       min="0" max="100" step="1"
                       value="{{ g_value }}">
            </div>

            <div class="row blue-row">
                <label for="b">BLUE (0~100)</label>
                <input type="number"
                       id="b" name="b"
                       min="0" max="100" step="1"
                       value="{{ b_value }}">
            </div>

            <div class="btn-area">
                <button type="submit">전송 (Send)</button>
            </div>
        </form>
    </div>
</body>
</html>
